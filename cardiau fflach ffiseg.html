<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="UTF-8">
<title>Cardiau Fflach Ffiseg</title>

<style>

    body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#unitSelector {
    padding: 10px;
    font-size: 1.1rem;
    border-radius: 6px;
    border: 1px solid #aaa;
    margin-bottom: 15px;
}

/* ✅ Responsive card container */
.card {
    width: 90vw;           /* Use screen width */
    max-width: 500px;
    height: 55vh;          /* Use screen height */
    max-height: 350px;
    perspective: 1000px;
    margin-top: 10px;
}

/* ✅ Internal card keeps aspect ratio */
.inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.7s;
    transform-style: preserve-3d;
    cursor: pointer;
}

/* Flip */
.flipped {
    transform: rotateY(180deg);
}

.side {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;

    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);

    padding: 20px;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    font-size: 1.4rem;  /* Default size */
}

/* ✅ Pastel theme */
.front {
    background-color: #FFEFD5;
}

.back {
    background-color: #E0F7FA;
    transform: rotateY(180deg);
}

img {
    max-width: 90%;
    max-height: 60%;
    margin-bottom: 12px;
    border-radius: 8px;
}

/* Button layout */
#controls {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

button {
    padding: 12px 18px;
    background: #0078d4;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
}

button:hover {
    background: #005fa3;
}

/* ✅ MOBILE OPTIMISATIONS */
@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    .card {
        width: 95vw;
        height: 60vh;
        max-height: none;
    }

    .side {
        font-size: 1.2rem;   /* Slightly smaller to fit mobile */
        padding: 10px;
    }

    img {
        max-height: 50%;
    }

    button {
        width: 30%;
        min-width: 100px;
        font-size: 1rem;
    }
}
</style>

<!-- MathJax support -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(','\\)'], ['$', '$']] },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>

</head>
<body>

<h2>Cardiau Fflach Ffiseg</h2>

<!-- Removed file uploader -->

<label for="unitSelector">Dewis Uned:</label>
<select id="unitSelector"></select>

<div class="card" id="card">
    <div class="inner" id="inner">
        <div class="side front" id="front"></div>
        <div class="side back" id="back"></div>
    </div>
</div>

<div id="controls">
    <button onclick="prevCard()">Previous</button>
    <button onclick="nextCard()">Next</button>
    <button onclick="shuffleCards()">Shuffle</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
let workbook;
let cards = [];
let index = 0;

// 🔗 Your OneDrive direct download link
const fileUrl = "https://raw.githubusercontent.com/GwyddonTryfan/CardiauFflach-TGAU/main/CardiauFflach.xlsx";

// Flip card
document.getElementById("inner").addEventListener("click", () => {
    document.getElementById("inner").classList.toggle("flipped");
});

// Load selected unit
document.getElementById("unitSelector").addEventListener("change", loadUnit);

// 🔄 Automatically load Excel file from OneDrive
window.addEventListener("DOMContentLoaded", () => {
    fetch(fileUrl)
        .then(res => res.arrayBuffer())
        .then(buffer => {
            workbook = XLSX.read(buffer, { type: "array" });

            const selector = document.getElementById("unitSelector");
            selector.innerHTML = "";

            workbook.SheetNames.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                option.textContent = name;
                selector.appendChild(option);
            });

            loadUnit();
        })
        .catch(err => console.error("Error loading Excel file:", err));
});

// Load selected sheet and convert to flashcards
function loadUnit() {
    const unit = document.getElementById("unitSelector").value;

    const sheet = workbook.Sheets[unit];
    const json = XLSX.utils.sheet_to_json(sheet);

    cards = json.map(row => ({
        question: row["Cwestiwn"],
        answer: row["Ateb"],
        image: row["Delwedd"]
    }));

    index = 0;
    displayCard();
}

// Display flashcard
function displayCard() {
    const card = cards[index];
    const front = document.getElementById("front");
    const back = document.getElementById("back");

    front.innerHTML = "";

    if (card.image) {
        const img = document.createElement("img");
        img.src = "images/" + card.image;
        front.appendChild(img);
    }

    const q = document.createElement("div");
    q.innerHTML = card.question;
    front.appendChild(q);

    back.innerHTML = card.answer;

    MathJax.typesetPromise();

    document.getElementById("inner").classList.remove("flipped");
}

// Navigation + shuffle
function nextCard() {
    index = (index + 1) % cards.length;
    displayCard();
}

function prevCard() {
    index = (index - 1 + cards.length) % cards.length;
    displayCard();
}

function shuffleCards() {
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    index = 0;
    displayCard();
}
</script>

</body>
</html>
