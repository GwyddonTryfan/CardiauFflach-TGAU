<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="UTF-8">
<title>Cardiau Fflach Ffiseg</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #unitSelector {
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #aaa;
        margin-bottom: 15px;
    }
    .card {
        width: 500px;
        height: 300px;
        perspective: 1000px;
        margin-top: 20px;
    }
    .inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.8s;
        transform-style: preserve-3d;
        cursor: pointer;
    }
    .flipped {
        transform: rotateY(180deg);
    }
    .side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        background: white;
        padding: 15px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow-y: auto;
        scrollbar-width: thin;
    }
    .front {
        background-color: #ffecb3;  /* soft orange */
    }
    .back {
        background-color: #c8e6c9;  /* soft green */
        transform: rotateY(180deg);
    }
    img {
        max-width: 90%;
        max-height: 80%;
        margin-bottom: 15px;
        border-radius: 6px;
    }
    #controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
    }
    button {
        padding: 10px 15px;
        border: none;
        background: #0078d4;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #005fa3;
    }
</style>

<!-- MathJax support -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(','\\)'], ['$', '$']] },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>

</head>
<body>

<h2>Cardiau Fflach Ffiseg</h2>

<!-- Removed file uploader -->

<div style="display: flex; gap: 20px;">
    <div>
        <label for="subjectSelector">Dewis Pwnc:</label>
        <select id="subjectSelector" onchange="loadExcelFile()">
            <option value="Ffiseg">Ffiseg</option>
            <option value="Cemeg">Cemeg</option>
        </select>
    </div>

    <div>
        <label for="unitSelector">Dewis Uned:</label>
        <select id="unitSelector"></select>
    </div>
</div>
    
<p id="counter" style="font-weight: bold; color: #555; margin-bottom: 5px;"></p>
<div class="card" id="card">
    <div class="inner" id="inner">
        <div class="side front" id="front"></div>
        <div class="side back" id="back"></div>
    </div>
</div>

<div id="controls">
    <button onclick="prevCard()">Yn ôl</button>
    <button onclick="nextCard()">Ymlaen</button>
    <button onclick="shuffleCards()">Cymysgu</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
let workbook;
let cards = [];
let index = 0;

// Update these URLs to match your GitHub file paths
const fileUrls = {
    "Ffiseg": "https://raw.githubusercontent.com/GwyddonTryfan/CardiauFflach-TGAU/main/CardiauFflachFfiseg.xlsx",
    "Cemeg": "https://raw.githubusercontent.com/GwyddonTryfan/CardiauFflach-TGAU/main/CardiauFflachCemeg.xlsx" 
};

// Automatically load the default subject on startup
window.addEventListener("DOMContentLoaded", loadExcelFile);

function loadExcelFile() {
    const subject = document.getElementById("subjectSelector").value;
    const url = fileUrls[subject];

    fetch(url)
        .then(res => res.arrayBuffer())
        .then(buffer => {
            workbook = XLSX.read(buffer, { type: "array" });

            const selector = document.getElementById("unitSelector");
            selector.innerHTML = ""; // Clear old units

            workbook.SheetNames.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                option.textContent = name;
                selector.appendChild(option);
            });

            loadUnit(); // Load the first unit of the new subject
        })
        .catch(err => {
            console.error("Error loading Excel file:", err);
            alert("Methu llwytho data " + subject);
        });
}
  
// Flip card
document.getElementById("inner").addEventListener("click", () => {
    document.getElementById("inner").classList.toggle("flipped");
});

// Load selected unit
document.getElementById("unitSelector").addEventListener("change", loadUnit);

// 🔄 Automatically load Excel file from OneDrive
window.addEventListener("DOMContentLoaded", () => {
    fetch(fileUrl)
        .then(res => res.arrayBuffer())
        .then(buffer => {
            workbook = XLSX.read(buffer, { type: "array" });

            const selector = document.getElementById("unitSelector");
            selector.innerHTML = "";

            workbook.SheetNames.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                option.textContent = name;
                selector.appendChild(option);
            });

            loadUnit();
        })
        .catch(err => console.error("Error loading Excel file:", err));
});

// Load selected sheet and convert to flashcards
function loadUnit() {
    const unit = document.getElementById("unitSelector").value;

    const sheet = workbook.Sheets[unit];
    const json = XLSX.utils.sheet_to_json(sheet);

    cards = json.map(row => ({
        question: row["Cwestiwn"],
        answer: row["Ateb"],
        image: row["Delwedd"]
    }));

    index = 0;
    displayCard();
}

// Display flashcard
function displayCard() {
    const card = cards[index];
    const front = document.getElementById("front");
    const back = document.getElementById("back");
// Update the counter text
    document.getElementById("counter").textContent = `Cerdyn ${index + 1} o ${cards.length}`;
    
    front.innerHTML = "";

    if (card.image) {
        const img = document.createElement("img");
        img.src = "images/" + card.image;
        front.appendChild(img);
    }

    const q = document.createElement("div");
    q.innerHTML = card.question;
    front.appendChild(q);

    back.innerHTML = card.answer;

    MathJax.typesetPromise();

    document.getElementById("inner").classList.remove("flipped");
}

// Navigation + shuffle
function nextCard() {
    index = (index + 1) % cards.length;
    displayCard();
}

function prevCard() {
    index = (index - 1 + cards.length) % cards.length;
    displayCard();
}

function shuffleCards() {
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    index = 0;
    displayCard();
}
</script>

</body>
</html>
