<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="UTF-8">
<title>Cardiau Fflach Gwyddoniaeth</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #unitSelector {
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #aaa;
        margin-bottom: 15px;
    }
    .card {
        width: 500px;
        height: 300px;
        perspective: 1000px;
        margin-top: 20px;
    }
    .inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.8s;
        transform-style: preserve-3d;
        cursor: pointer;
    }
    .flipped {
        transform: rotateY(180deg);
    }
    .side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        background: white;
        padding: 10px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow-y: auto;
        scrollbar-width: thin;
    }
    
    .front {
        background-color: #ffecb3;  /* soft orange */
    }
    .back {
        background-color: #c8e6c9;  /* soft green */
        transform: rotateY(180deg);
    }

    img {
        max-width: 100%;      /* Prevents the image from hitting the edges */
        max-height: 90%;   /* Limits height to leave room for text below */
        width: auto;         /* Allows width to scale naturally */
        height: auto;        /* Allows height to scale naturally */
        object-fit: contain; /* The magic line: preserves aspect ratio */
        display: block;      /* Helps with centering */
        margin: 0 auto 5px auto; /* Centers and adds tiny gap for text */
    }

   
    #controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
    }
    button {
        padding: 10px 15px;
        border: none;
        background: #0078d4;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #005fa3;
    }

    .instruction-box {
    text-align: left;       /* Aligns text to the left inside the box */
    display: inline-block;  /* Makes the box shrink to fit the text */
    max-width: 90%;         /* Prevents it from hitting the edges */
    }
       
</style>

<!-- MathJax support -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(','\\)'], ['$', '$']] },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>

</head>
<body>

<h2>Cardiau Fflach Gwyddoniaeth</h2>

<!-- Removed file uploader -->

<div style="display: flex; gap: 20px;">
    <div>
        <label for="subjectSelector">Dewis Pwnc:</label>
        <select id="subjectSelector" onchange="loadExcelFile()">
            <option value="Cemeg Bl10">Cemegbl10</option>
            <option value="Ffiseg Bl10">Ffisegbl10</option>
            <option value="Cemeg Bl11">Cemegbl11</option>
            <option value="Ffiseg Bl11">Ffisegbl11</option>
        </select>
    </div>

    <div>
        <label for="unitSelector">Dewis Uned:</label>
        <select id="unitSelector"></select>
    </div>
</div>
    
<p id="counter" style="font-weight: bold; color: #555; margin-bottom: 5px;"></p>
<div class="card" id="card">
    <div class="inner" id="inner">
        <div class="side front" id="front"></div>
        <div class="side back" id="back"></div>
    </div>
</div>

<div id="controls">
    <button onclick="prevCard()">Yn ôl</button>
    <button onclick="nextCard()">Ymlaen</button>
    <button onclick="shuffleCards()">Cymysgu</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
let workbook;
let cards = [];
let index = 0;

// Update these URLs to match your GitHub file paths
const fileUrls = {
    "Ffiseg Bl11": "https://raw.githubusercontent.com/GwyddonTryfan/CardiauFflach-TGAU/main/CardiauFflachFfisegbl11.xlsx",
    "Cemeg Bl11": "https://raw.githubusercontent.com/GwyddonTryfan/CardiauFflach-TGAU/main/CardiauFflachCemegbl11.xlsx" 
};

// Automatically load the default subject on startup

window.addEventListener("DOMContentLoaded", loadExcelFile);

function loadExcelFile() {
    const subjectSelector = document.getElementById("subjectSelector");
    const subject = subjectSelector.value;
    const url = fileUrls[subject];

    fetch(url)
        .then(res => {
            if (!res.ok) throw new Error("Gwall lwytho ffeil: " + res.statusText);
            return res.arrayBuffer();
        })
        .then(buffer => {
            workbook = XLSX.read(buffer, { type: "array" });
            const selector = document.getElementById("unitSelector");
            selector.innerHTML = ""; 

            workbook.SheetNames.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                option.textContent = name;
                selector.appendChild(option);
            });

            loadUnit();
        })
        .catch(err => console.error("Error:", err));
}
  
// Flip card
document.getElementById("inner").addEventListener("click", () => {
    document.getElementById("inner").classList.toggle("flipped");
});

// Load selected unit
document.getElementById("unitSelector").addEventListener("change", loadUnit);

// Load selected sheet and convert to flashcards
function loadUnit() {
    const unit = document.getElementById("unitSelector").value;

    const sheet = workbook.Sheets[unit];
    const json = XLSX.utils.sheet_to_json(sheet);

    cards = json.map(row => ({
        question: row["Cwestiwn"],
        answer: row["Ateb"],
        image: row["Delwedd Cwestiwn"],
        answerImage: row["Delwedd Ateb"]
    }));

    index = 0;
    displayCard();
}


function displayCard() {
    const card = cards[index];
    const front = document.getElementById("front");
    const back = document.getElementById("back");
    const counter = document.getElementById("counter");
    const githubBase = "https://raw.githubusercontent.com/GwyddonTryfan/CardiauFflach-TGAU/main/images/";
    
    // 1. Update the counter
    if (counter) {
        counter.textContent = `Cerdyn ${index + 1} o ${cards.length}`;
    }

    // --- FRONT OF CARD ---
    front.innerHTML = ""; // Clear front

    if (card.image) {
        const img = document.createElement("img");
        img.src = githubBase + card.image.trim();
        img.onerror = function() { this.style.display = 'none'; };
        front.appendChild(img);
    }

    const q = document.createElement("div");
    q.className = "instruction-box";
    q.innerHTML = card.question.replace(/\n/g, "<br>");
    front.appendChild(q);


    // --- BACK OF CARD ---
    back.innerHTML = ""; // Clear back

    // 2. Add Answer Image if it exists
    if (card.answerImage) {
        const aImg = document.createElement("img");
        aImg.src = githubBase + card.answerImage.trim();
        aImg.onerror = function() { 
            console.error("Methu canfod delwedd ateb: " + this.src);
            this.style.display = 'none'; 
        };
        back.appendChild(aImg);
    }

    // 3. Add Answer Text
    const aText = document.createElement("div");
    aText.className = "instruction-box";
    aText.innerHTML = card.answer.replace(/\n/g, "<br>");
    back.appendChild(aText);


    // --- FINAL WRAP UP ---
    MathJax.typesetPromise();
    document.getElementById("inner").classList.remove("flipped");
}


    // 3. DEBUG LINE (You can delete this once fixed)
    //const debugText = document.createElement("div");
    //debugText.style.fontSize = "10px";
    //debugText.style.color = "red";
    //debugText.innerText = card.image ? "File: " + card.image : "No image found in Excel";
    //front.appendChild(debugText);

// Navigation + shuffle
function nextCard() {
    index = (index + 1) % cards.length;
    displayCard();
}

function prevCard() {
    index = (index - 1 + cards.length) % cards.length;
    displayCard();
}

function shuffleCards() {
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    index = 0;
    displayCard();
}
</script>

</body>
</html>
